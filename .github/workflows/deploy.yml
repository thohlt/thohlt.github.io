name: Deploy to GitHub Pages
on:
  push:
    branches:
      - main
jobs:
  build:
    name: Publish site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          lfs: true
      - name: Build and deploy
        uses: shalzz/zola-deploy-action@v0.23.6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}